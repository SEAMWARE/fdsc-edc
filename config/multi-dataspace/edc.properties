#
# Example configuration of controlplane-dcp in virtual participant-context mode,
# taking part in two dataspaces (A and B) at once.
#
# Each dataspace is one participant context with its own DID and STS client,
# associated with the dataspace profile(s) it speaks. All contexts share one
# TMForum, one ODRL-PAP and one Vault. DSP requests are served at
#   <web.http.protocol.path>/<participant context id>/<profile name>/...
# e.g. http://edc:8282/protocol/dataspace-a/dsp-dataspace-a/catalog/request
#
# Usage: pass this file via the EDC_FS_CONFIG environment variable or the
# -Dedc.fs.config JVM argument. Host names, DIDs and URLs are placeholders.
#

# ---------------------------------------------------------------------------
# Runtime and web contexts
# ---------------------------------------------------------------------------

# Fallback identity for TMForum entities of the default context (dataspace-a).
edc.participant.id=did:web:dataspace-a.example.org
edc.hostname=edc
web.http.port=8080
web.http.path=/api
web.http.management.port=8181
web.http.management.path=/management
web.http.protocol.port=8282
web.http.protocol.path=/protocol
web.http.control.port=8083
web.http.control.path=/control

# ---------------------------------------------------------------------------
# DSP callback address
# ---------------------------------------------------------------------------

# %s is replaced by the participant context id, so web.http.protocol.virtual is not needed.
edc.dsp.callback.address=http://edc:8282/protocol/%s

# ---------------------------------------------------------------------------
# Dataspace profiles
# ---------------------------------------------------------------------------

# One profile per dataspace, on DSP 2025-1. Upstream's default http-dsp-profile-2025-1 is only
# served while no profile is configured, so it is declared here explicitly.
edc.dataspace.profiles.default.name=http-dsp-profile-2025-1
edc.dataspace.profiles.default.protocol.version=2025-1
edc.dataspace.profiles.default.protocol.binding=HTTPS
edc.dataspace.profiles.default.protocol.namespace=https://w3id.org/dspace/2025/1/
edc.dataspace.profiles.default.jsonld.context.urls=https://w3id.org/dspace/2025/1/context.jsonld,https://w3id.org/edc/dspace/v0.0.1
edc.dataspace.profiles.a.name=dsp-dataspace-a
edc.dataspace.profiles.a.protocol.version=2025-1
edc.dataspace.profiles.a.protocol.binding=HTTPS
edc.dataspace.profiles.a.protocol.namespace=https://w3id.org/dspace/2025/1/
edc.dataspace.profiles.a.jsonld.context.urls=https://w3id.org/dspace/2025/1/context.jsonld,https://w3id.org/edc/dspace/v0.0.1
edc.dataspace.profiles.b.name=dsp-dataspace-b
edc.dataspace.profiles.b.protocol.version=2025-1
edc.dataspace.profiles.b.protocol.binding=HTTPS
edc.dataspace.profiles.b.protocol.namespace=https://w3id.org/dspace/2025/1/
edc.dataspace.profiles.b.jsonld.context.urls=https://w3id.org/dspace/2025/1/context.jsonld,https://w3id.org/edc/dspace/v0.0.1

# ---------------------------------------------------------------------------
# Participant contexts (seeded at startup by participant-bootstrap-extension)
# ---------------------------------------------------------------------------

# Dataspace A: own DID and STS client; also reachable via the default profile.
fdsc.participants.a.id=dataspace-a
fdsc.participants.a.identity=did:web:dataspace-a.example.org
fdsc.participants.a.profiles=dsp-dataspace-a,http-dsp-profile-2025-1
fdsc.participants.a.config.edc.iam.sts.oauth.token.url=http://keycloak-a:8080/realms/dataspace-a/protocol/openid-connect/token
fdsc.participants.a.config.edc.iam.sts.oauth.client.id=edc-dataspace-a
fdsc.participants.a.config.edc.iam.sts.oauth.client.secret.alias=dataspace-a-sts-client-secret

# Dataspace B: own DID and STS client; only reachable via its own profile.
fdsc.participants.b.id=dataspace-b
fdsc.participants.b.identity=did:web:dataspace-b.example.org
fdsc.participants.b.profiles=dsp-dataspace-b
fdsc.participants.b.config.edc.iam.sts.oauth.token.url=http://keycloak-b:8080/realms/dataspace-b/protocol/openid-connect/token
fdsc.participants.b.config.edc.iam.sts.oauth.client.id=edc-dataspace-b
fdsc.participants.b.config.edc.iam.sts.oauth.client.secret.alias=dataspace-b-sts-client-secret

# ---------------------------------------------------------------------------
# Management API v5 (OAuth2)
# ---------------------------------------------------------------------------

# JWTs need a scope of management-api:admin/read/write; without admin, sub must name a context.
edc.iam.oauth2.issuer=http://keycloak:8080/realms/edc-management
edc.iam.oauth2.jwks.url=http://keycloak:8080/realms/edc-management/protocol/openid-connect/certs

# ---------------------------------------------------------------------------
# Vault and private participant config
# ---------------------------------------------------------------------------

# Shared by all contexts; each context reads its STS secret under its own alias.
edc.vault.hashicorp.url=http://vault:8200
edc.vault.hashicorp.token=root

# Encrypts private participant-config entries with the AES key stored in the Vault under this alias.
edc.participants.config.encryption.algorithm=aes
edc.encryption.aes.key.alias=participant-config-aes-key

# ---------------------------------------------------------------------------
# DCP scopes
# ---------------------------------------------------------------------------

# Default scopes for all profiles; dataspace B requests a different credential.
dcp.enabled=true
dcp.scopes.catalog=org.eclipse.dspace.dcp.vc.type:MembershipCredential:read
dcp.scopes.negotiation=org.eclipse.dspace.dcp.vc.type:MembershipCredential:read
dcp.scopes.transfer=org.eclipse.dspace.dcp.vc.type:MembershipCredential:read
dcp.profiles.dsp-dataspace-b.scopes.catalog=org.eclipse.dspace.dcp.vc.type:DataspaceBMembershipCredential:read
dcp.profiles.dsp-dataspace-b.scopes.negotiation=org.eclipse.dspace.dcp.vc.type:DataspaceBMembershipCredential:read
dcp.profiles.dsp-dataspace-b.scopes.transfer=org.eclipse.dspace.dcp.vc.type:DataspaceBMembershipCredential:read

# ---------------------------------------------------------------------------
# EBSI Trusted Issuers Registry
# ---------------------------------------------------------------------------

# Global TIL for profiles without their own; dataspace B trusts only issuers in its own TIL.
ebsiTir.enabled=true
ebsiTir.tilAddress=http://til-a:8080
ebsiTir.profiles.dsp-dataspace-b.tilAddress=http://til-b:8080

# ---------------------------------------------------------------------------
# TMForum (shared by all dataspaces)
# ---------------------------------------------------------------------------

# Untagged TMForum entities (offerings, quotes, agreements) belong to dataspace-a.
tmfExtension.enabled=true
tmfExtension.catalog.enabled=true
tmfExtension.defaultParticipantContextId=dataspace-a
tmfExtension.quoteApi=http://tmforum:8632/tmf-api/quote/v4
tmfExtension.agreementApi=http://tmforum:8632/tmf-api/agreementManagement/v4
tmfExtension.productOrderApi=http://tmforum:8632/tmf-api/productOrderingManagement/v4
tmfExtension.productCatalogApi=http://tmforum:8632/tmf-api/productCatalogManagement/v4
tmfExtension.productInventoryApi=http://tmforum:8632/tmf-api/productInventory/v4
tmfExtension.usageManagementApi=http://tmforum:8632/tmf-api/usageManagement/v4
tmfExtension.partyCatalogApi=http://tmforum:8632/tmf-api/party/v4

# ---------------------------------------------------------------------------
# FDSC transfer
# ---------------------------------------------------------------------------

# Configured as for a single-dataspace deployment (fdscTransfer.*); disabled to keep the example short.
fdscTransfer.enabled=false

# ---------------------------------------------------------------------------
# ODRL-PAP policy evaluation (shared by all dataspaces)
# ---------------------------------------------------------------------------

# Policies are validated against the external ODRL-PAP before EDC's constraint functions run.
odrlPap.policy.enabled=true
odrlPap.host=http://odrl-pap:8080
odrlPap.policy.denyOnError=true
odrlPap.policy.scopes.catalog=true
odrlPap.policy.scopes.negotiation=true
odrlPap.policy.scopes.transfer=true
