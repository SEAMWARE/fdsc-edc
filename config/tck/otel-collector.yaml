receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318

exporters:
  # audit logs in full, metrics summarized to keep the TCK output readable
  debug/logs:
    verbosity: detailed
  debug/metrics:
    verbosity: basic

service:
  pipelines:
    logs:
      receivers: [otlp]
      exporters: [debug/logs]
    metrics:
      receivers: [otlp]
      exporters: [debug/metrics]
